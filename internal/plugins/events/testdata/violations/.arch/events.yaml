version: 1
component: violations
owns: violations
description: Component with deliberate rule violations for testing

receives:
  # Not a violation any more: observing an action in a namespace this component
  # does not own is ordinary choreography. Kept here so the fixture proves it
  # produces no ownership finding.
  - kind: billing.invoice.issue
    role: action
    description: Observing an action owned by another namespace

emits:
  # Also not a violation: ownership is schema authority, not exclusive
  # production. This only yields closure warnings when nobody observes it.
  - kind: ledger.entry.posted
    role: fact
    description: Emitting into a namespace owned elsewhere

  # ERROR (exclusive-unhandled): opted into single-handler delivery, no receiver.
  - kind: violations.command.run
    role: action
    delivery: exclusive
    description: Declares an exclusive handler contract that nothing satisfies

  # WARNING (orphan-event): nobody receives or folds it.
  - kind: violations.orphan.fact
    role: fact
    description: Fact that nobody listens to

  # ERROR (kind-role-conflict): received above as an action, emitted here as a
  # fact. Role is a property of the kind, so this must become two kinds.
  - kind: billing.invoice.issue
    role: fact
    description: Same kind, second role

folds:
  # WARNING (starved-fold): consumes entry matches nothing.
  # WARNING (underspecified-state): object state with no shape.
  - name: violations.starved-fold
    subjects:
      - 'svc.*.violations.{tenant}.events.>'
    consumes: [nonexistent.events.*]
    state:
      type: object

  # ERROR (partition-mismatch): the two subjects address different states.
  - name: violations.mixed-partitions
    subjects:
      - svc.*.violations.{tenant}.events.>
      - svc.*.violations.{region}.events.>
    consumes: [violations.orphan.*]
    state:
      type: object
      properties:
        Count: {type: integer}

  # ERROR (malformed-slot): empty {} slot token.
  - name: violations.bad-subject
    subjects:
      - 'svc.*.violations.{}.events.>'
    consumes: [violations.orphan.*]
    state:
      type: object
      properties:
        Count: {type: integer}

types:
  # ERROR (unresolved-ref).
  BadRef:
    type: object
    properties:
      Field: {$ref: '#/types/DoesNotExist'}
