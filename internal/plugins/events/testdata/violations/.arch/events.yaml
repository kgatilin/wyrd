version: 2
component: violations
owns: violations
description: Component with deliberate rule violations for testing

inputs:
  # Not a violation: being triggered by an event in a namespace this component
  # does not own is ordinary choreography. Kept here so the fixture proves it
  # produces no ownership finding.
  - kind: billing.invoice.issue
    pattern: 'svc.*.billing.{account}.invoice.issue'
    description: Triggered by an event owned by another namespace

  # ERROR (self-input-conflict): also an output below. A component does not
  # trigger itself; state_events is the way to carry its own outcome into
  # state.
  - kind: violations.self.echo
    pattern: 'svc.*.violations.{account}.self.echo'
    description: Input on a kind this component outputs

  # WARNING (starved-input): no component outputs it, so the trigger never
  # fires.
  - kind: violations.absent.trigger
    pattern: 'svc.*.violations.{account}.absent.trigger'

  # ERROR (partition-mismatch): keyed by region where the rest of the read-set
  # is keyed by account, so there is no single state to fold into.
  - kind: violations.mixed.partition
    pattern: 'svc.*.violations.{region}.mixed.partition'

  # ERROR (malformed-slot): empty {} slot token.
  - kind: violations.bad.subject
    pattern: 'svc.*.violations.{}.bad.subject'

outputs:
  # Not a violation: ownership is schema authority, not exclusive production.
  - kind: ledger.entry.posted
    pattern: 'svc.*.ledger.{account}.entry.posted'
    description: Appending into a namespace owned elsewhere

  # ERROR (exclusive-unhandled): opted into single-handler delivery, and no
  # component takes it as an input.
  - kind: violations.command.run
    pattern: 'svc.*.violations.{account}.command.run'
    delivery: exclusive
    description: Declares an exclusive handler contract that nothing satisfies

  # WARNING (orphan-event): no component inputs it or folds it.
  - kind: violations.orphan.fact
    pattern: 'svc.*.violations.{account}.orphan.fact'
    description: Event that nobody observes

  - kind: violations.self.echo
    pattern: 'svc.*.violations.{account}.self.echo'
    description: The output side of the self-input conflict above

  # ERROR (kind-pattern-conflict): one kind, two addresses. Subscribers of one
  # will never see what is appended on the other.
  - kind: violations.orphan.dual
    pattern: 'svc.*.violations.{account}.orphan.dual'
    description: Same kind, first subject
  - kind: violations.orphan.dual
    pattern: 'svc.*.violations.{account}.dual.orphan'
    description: Same kind, second subject

state_events:
  # WARNING (starved-state-event): the projection tracks something no
  # component ever appends.
  - kind: violations.absent.outcome
    pattern: 'svc.*.violations.{account}.absent.outcome'

# WARNING (underspecified-state): an object with no shape.
state:
  type: object

types:
  # ERROR (unresolved-ref).
  BadRef:
    type: object
    properties:
      Field: {$ref: '#/types/DoesNotExist'}
