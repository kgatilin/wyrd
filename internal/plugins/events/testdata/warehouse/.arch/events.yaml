version: 2
component: warehouse
owns: warehouse
description: Inventory management with multi-slot partition keys

# One state per region, location, and SKU: every read-set subject repeats that
# three-token key in the same order.

inputs:
  - kind: warehouse.stock.adjust
    pattern: 'svc.*.warehouse.{region}.{location}.stock.{sku}.adjust'
    description: Adjust stock level at a location
    schema:
      type: object
      required: [Region, Location, SKU, Delta]
      properties:
        Region: {type: string}
        Location: {type: string}
        SKU: {type: string}
        Delta: {type: integer}

outputs:
  - kind: warehouse.stock.adjusted
    pattern: 'svc.*.warehouse.{region}.{location}.stock.{sku}.adjusted'
    schema:
      type: object
      properties:
        Region: {type: string}
        Location: {type: string}
        SKU: {type: string}
        NewLevel: {type: integer}
  - kind: warehouse.stock.depleted
    pattern: 'svc.*.warehouse.{region}.{location}.stock.{sku}.depleted'
    description: Stock fell to zero
    schema:
      type: object
      properties:
        Region: {type: string}
        Location: {type: string}
        SKU: {type: string}

state_events:
  - kind: warehouse.stock.adjusted
    pattern: 'svc.*.warehouse.{region}.{location}.stock.{sku}.adjusted'
  - kind: warehouse.stock.depleted
    pattern: 'svc.*.warehouse.{region}.{location}.stock.{sku}.depleted'

state:
  type: object
  properties:
    Level: {type: integer}
    LastUpdated: {type: string, format: date-time}
