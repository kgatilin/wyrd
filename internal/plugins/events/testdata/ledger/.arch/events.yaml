version: 1
component: ledger
owns: ledger
description: Double-entry accounting ledger

receives:
  # A genuine command: the ledger claims to be its only handler, and says so
  # explicitly. Without this opt-in, nothing would constrain how many
  # components observe the kind.
  - kind: ledger.entry.post
    role: action
    delivery: exclusive
    description: Post a ledger entry (debit/credit pair)
    schema:
      type: object
      required: [Debit, Credit, Amount]
      properties:
        Debit: {type: string}
        Credit: {type: string}
        Amount: {type: number}
        Reference: {type: string}

emits:
  - kind: ledger.entry.posted
    role: fact
    schema:
      type: object
      properties:
        EntryID: {type: string}
        Debit: {type: string}
        Credit: {type: string}
        Amount: {type: number}

types:
  Entry:
    type: object
    properties:
      ID: {type: string}
      Debit: {type: string}
      Credit: {type: string}
      Amount: {type: number}
      PostedAt: {type: string, format: date-time}
