version: 2
component: ledger
owns: ledger
description: Double-entry accounting ledger

inputs:
  # A genuine command: the ledger claims to be its only handler, and says so
  # explicitly. Without this opt-in, nothing would constrain how many
  # components are triggered by the kind.
  - kind: ledger.entry.post
    pattern: 'svc.*.ledger.{account}.entry.post'
    delivery: exclusive
    description: Post a ledger entry (debit/credit pair)
    schema:
      type: object
      required: [Debit, Credit, Amount]
      properties:
        Debit: {type: string}
        Credit: {type: string}
        Amount: {type: number}
        Reference: {type: string}

outputs:
  - kind: ledger.entry.posted
    pattern: 'svc.*.ledger.{account}.entry.posted'
    schema:
      type: object
      properties:
        EntryID: {type: string}
        Debit: {type: string}
        Credit: {type: string}
        Amount: {type: number}

state_events:
  - kind: ledger.entry.posted
    pattern: 'svc.*.ledger.{account}.entry.posted'

state:
  type: object
  properties:
    Entries: {type: array, items: {$ref: '#/types/Entry'}}

types:
  Entry:
    type: object
    properties:
      ID: {type: string}
      Debit: {type: string}
      Credit: {type: string}
      Amount: {type: number}
      PostedAt: {type: string, format: date-time}
