version: 2
component: billing
owns: billing
description: Invoice lifecycle management

inputs:
  - kind: billing.invoice.issue
    pattern: 'svc.*.billing.{account}.invoice.issue'
    description: Create an invoice for one account
    exposure: [public_api]
    schema:
      type: object
      required: [Account]
      properties:
        Account: {type: string}
        Currency: {type: string}
        Lines: {type: array, items: {$ref: '#/types/Line'}}

outputs:
  - kind: billing.invoice.issued
    pattern: 'svc.*.billing.{account}.invoice.issued'
    schema: {$ref: '#/types/Invoice'}
  - kind: ledger.entry.post
    pattern: 'svc.*.ledger.{account}.entry.post'
    description: >-
      Ask the ledger to post an entry. Appending into a namespace billing does
      not own is normal: ownership is schema authority, not an exclusive right
      to produce.

state_events:
  # The component's own outcome, folded back into its state. This is the
  # channel that makes an inputs/outputs overlap unambiguously a mistake.
  - kind: billing.invoice.issued
    pattern: 'svc.*.billing.{account}.invoice.issued'

# One state per account — the key every read-set subject above agrees on.
state:
  type: object
  properties:
    Open: {type: array, items: {$ref: '#/types/Invoice'}}

types:
  Invoice:
    type: object
    properties:
      Account: {type: string}
      Status: {type: string, enum: [open, paid, void]}
      Lines:
        oneOf:
          - {type: array, items: {$ref: '#/types/Line'}}
          - type: string
            deprecated: true
            description: legacy single-line form, read-only
  Line:
    type: object
    properties:
      Description: {type: string}
      Amount: {type: number}
