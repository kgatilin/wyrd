version: 1
component: billing
owns: billing
description: Invoice lifecycle management

receives:
  - kind: billing.invoice.issue
    role: action
    description: Create an invoice for one account
    exposure: [public_api]
    schema:
      type: object
      required: [Account]
      properties:
        Account: {type: string}
        Currency: {type: string}
        Lines: {type: array, items: {$ref: '#/types/Line'}}

emits:
  - kind: billing.invoice.issued
    role: fact
    schema: {$ref: '#/types/Invoice'}
  - kind: ledger.entry.post
    role: action
    description: >-
      Ask the ledger to post an entry. Emitting into a namespace billing does
      not own is normal: ownership is schema authority, not an exclusive right
      to produce.

folds:
  # Two subjects, one partition key: both read per-account state.
  - name: billing.open-invoices
    subjects:
      - svc.*.billing.{account}.invoice.>
      - svc.*.billing.{account}.credit.>
    consumes: [billing.invoice.*]
    state:
      type: object
      properties:
        Open: {type: array, items: {$ref: '#/types/Invoice'}}

types:
  Invoice:
    type: object
    properties:
      Account: {type: string}
      Status: {type: string, enum: [open, paid, void]}
      Lines:
        oneOf:
          - {type: array, items: {$ref: '#/types/Line'}}
          - type: string
            deprecated: true
            description: legacy single-line form, read-only
  Line:
    type: object
    properties:
      Description: {type: string}
      Amount: {type: number}
