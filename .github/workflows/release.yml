name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (must already exist)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # wyrd embeds web/dist; wyrd-check does not, which is why the
      # validation-only binary can be built without Node at all.
      - name: Build review UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Gate on wyrd's own architecture rules
        run: go run ./cmd/wyrd-check all

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          # CGO off so the binaries are static and portable across distros;
          # -trimpath keeps build paths out of the artifact.
          export CGO_ENABLED=0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            export GOOS GOARCH
            for cmd in wyrd wyrd-check; do
              stage="dist/stage/${cmd}_${VERSION}_${GOOS}_${GOARCH}"
              mkdir -p "$stage"
              go build \
                -trimpath \
                -ldflags "-s -w -X main.Version=${VERSION}" \
                -o "$stage/$cmd" "./cmd/$cmd"
              # Named members, not `.`: packing from `.` stores the binary as
              # ./wyrd-check, and GNU tar will not extract that under the bare
              # name the installer asks for. Spelled out in two branches so no
              # unquoted word splitting is involved.
              out="dist/${cmd}_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
              if cp README.md "$stage/" 2>/dev/null; then
                tar -czf "$out" -C "$stage" "$cmd" README.md
              else
                tar -czf "$out" -C "$stage" "$cmd"
              fi
            done
          done
          rm -rf dist/stage
          # The installer is published alongside the binaries so a pinned
          # release can be installed with the script it shipped with.
          cp install.sh dist/
          ( cd dist && sha256sum *.tar.gz > checksums.txt )
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<NOTES
          ## Install

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/kgatilin/wyrd/main/install.sh | sh -s -- --version $VERSION
          \`\`\`

          Or take a tarball below. \`go install\` does not work for this project —
          the review UI is embedded from \`web/dist\`, which is not in the module zip.

          ## Binaries

          | Artifact | What it is |
          |---|---|
          | \`wyrd_*\` | Full wyrd: code graph, MCP server, review UI, diagram generation. |
          | \`wyrd-check_*\` | The architecture gates only — overlay layer rules and dependency policy. ~6x smaller, no UI or renderer linked in. Use it in CI. |

          \`\`\`
          wyrd daemon start    # parse the repo, print the review URL
          wyrd-check all       # layer-rule + dependency-policy gates, non-zero on violations
          \`\`\`
          NOTES
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "$VERSION" \
              --notes "$notes"
          fi

  image:
    # The daemon's container image and the Helm chart that deploys it, both
    # to the repository owner's ghcr.io namespace:
    #   ghcr.io/<owner>/wyrd:<tag>
    #   oci://ghcr.io/<owner>/charts/wyrd, version <tag without the v>
    name: Publish image and chart ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    needs: release
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The Dockerfile builds the review UI itself, so no Node is set up here.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.REGISTRY }}/wyrd:${{ env.VERSION }}

      - name: Package and push the chart
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm dependency build charts/wyrd
          # A chart version is SemVer without the leading v; the image tag
          # the chart deploys by default keeps it.
          helm package charts/wyrd --version "${VERSION#v}" --app-version "$VERSION" -d dist
          helm push dist/wyrd-*.tgz "oci://${REGISTRY}/charts"
